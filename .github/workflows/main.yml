name: Run Holder Change Scraper

on:
  schedule:
    # 10:13 น. เวลาไทย
    - cron: '13 3 * * 0-5'

    # 11:13 น. เวลาไทย
    - cron: '13 4 * * 0-5'

    # 12:13 น. เวลาไทย
    - cron: '13 5 * * 0-5'

    # 13:13 น. เวลาไทย
    - cron: '13 6 * * 0-5'

    # 14:13 น. เวลาไทย
    - cron: '13 7 * * 0-5'

    # 15:13 น. เวลาไทย
    - cron: '13 8 * * 0-5'

    # 16:13 น. เวลาไทย
    - cron: '13 9 * * 0-5'

    # 03:13 น. เวลาไทย
    - cron: '13 20 * * 0-5'

  workflow_dispatch:

jobs:
  scrape_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install pandas requests beautifulsoup4 lxml html5lib pdfplumber selenium webdriver-manager

      - name: Run Holder Change Scraper
        run: python holder_change.py

      - name: Save Data to Main Branch
        run: |
          # 1. ตั้งค่าบอท
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 2. ดึงข้อมูลล่าสุดและสลับมาที่เส้นสีฟ้า (main) ให้ชัวร์
          git fetch origin main
          git checkout main
          
          # 3. เตรียมไฟล์ CSV
          git add data_holder_change/*.csv
          
          # 4. ตรวจสอบและบันทึกข้อมูล (Commit & Push)
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update trade data: $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No changes to update."
          fi
